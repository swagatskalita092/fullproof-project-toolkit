<svg width="1200" height="28" viewBox="0 0 1200 28" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="section divider" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1e42" stop-opacity="0"/>
      <stop offset="45%" stop-color="#7fb0ff" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#7fb0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1e42" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    line.base { stroke: rgba(127,176,255,0.25); stroke-width: 1.5; }
    rect.sweep {
      animation: sweep 5s linear infinite;
    }
    @keyframes sweep {
      0%   { transform: translateX(-300px); }
      100% { transform: translateX(1200px); }
    }
    circle.tick { fill: #7fb0ff; }
  </style>
  <line class="base" x1="0" y1="14" x2="1200" y2="14"/>
  <rect class="sweep" x="0" y="11" width="300" height="6" fill="url(#sweep)"/>
  <circle class="tick" cx="0" cy="14" r="2.5"/>
  <circle class="tick" cx="1198" cy="14" r="2.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
