<svg width="1200" height="32" viewBox="0 0 1200 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="section divider: nothing claimed that wasn't proven">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1e42" stop-opacity="0"/>
      <stop offset="45%" stop-color="#7fb0ff" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#7fb0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1e42" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1e42" stop-opacity="0"/>
      <stop offset="20%" stop-color="#7fb0ff" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#7fb0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a1e42" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; }
    line.base { stroke: url(#fade); stroke-width: 1.5; }
    rect.sweep { animation: sweep 6s linear infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-300px); }
      100% { transform: translateX(1200px); }
    }
    circle.tick { fill: #7fb0ff; }
    .kicker {
      fill: rgba(195,216,255,0.55);
      font-size: 10px;
      letter-spacing: 3px;
    }
    .kickerbg { fill: #0a1e42; }
  </style>
  <line class="base" x1="0" y1="16" x2="1200" y2="16"/>
  <rect class="sweep" x="0" y="13" width="300" height="6" fill="url(#sweep)"/>
  <circle class="tick" cx="0" cy="16" r="2.5"/>
  <circle class="tick" cx="1198" cy="16" r="2.5"/>
  <rect class="kickerbg" x="430" y="7" width="340" height="18"/>
  <text class="kicker" x="600" y="20" text-anchor="middle">NOTHING CLAIMED THAT WASN'T PROVEN</text>
</svg>
