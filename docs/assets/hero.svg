<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="project-blueprint: build interview-ready projects, phase by phase">
  <defs>
    <pattern id="minorGrid" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 6 0 L 0 0 0 6" fill="none" stroke="rgba(120,170,255,0.06)" stroke-width="1"/>
    </pattern>
    <pattern id="majorGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="url(#minorGrid)"/>
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(120,170,255,0.14)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .bg { fill: #0a1e42; }
    .grid { fill: url(#majorGrid); }
    text { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; }

    .drawline {
      stroke-dasharray: 2888;
      stroke-dashoffset: 2888;
      animation: draw 1.6s ease-out forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .corner { stroke: #cfe3ff; stroke-width: 1.6; fill: none;
      stroke-dasharray: 40; stroke-dashoffset: 40;
      animation: draw 0.6s ease-out forwards; }
    .c2 { animation-delay: .15s; }
    .c3 { animation-delay: .3s; }
    .c4 { animation-delay: .45s; }

    .fadeUp { opacity: 0; transform: translateY(10px); animation: fadeUp .7s ease-out forwards; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    .label { animation-delay: .5s; }
    .title { animation-delay: .75s; }
    .tagline { animation-delay: 1.05s; }

    .node { fill: #0a1e42; stroke: #7fb0ff; stroke-width: 2; }
    .nodelabel { fill: rgba(195,216,255,0.65); font-size: 9px; letter-spacing: 1px; }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    .n1 { animation-delay: 0s; }
    .n2 { animation-delay: .5s; }
    .n3 { animation-delay: 1s; }
    .n4 { animation-delay: 1.5s; }
    .n5 { animation-delay: 2s; }
    @keyframes pulse {
      0%   { fill: #0a1e42; }
      10%  { fill: #7fb0ff; }
      35%  { fill: #7fb0ff; }
      55%  { fill: #0a1e42; }
      100% { fill: #0a1e42; }
    }

    .flowline { stroke: rgba(160,200,255,0.4); stroke-width: 2; }
    .flowdot {
      r: 3; fill: #e8f1ff;
      offset-rotate: 0deg;
    }
  </style>

  <rect class="bg" width="1200" height="300"/>
  <rect class="grid" width="1200" height="300"/>

  <rect class="drawline" x="14" y="14" width="1172" height="272" fill="none" stroke="rgba(160,200,255,0.55)" stroke-width="1.5"/>

  <path class="corner" d="M10,22 L10,10 L22,10"/>
  <path class="corner c2" d="M1190,22 L1190,10 L1178,10"/>
  <path class="corner c3" d="M10,278 L10,290 L22,290"/>
  <path class="corner c4" d="M1190,278 L1190,290 L1178,290"/>

  <text class="fadeUp label" x="70" y="108" fill="#7fb0ff" font-size="13" letter-spacing="6" font-weight="600">A METHODOLOGY, NOT A TEMPLATE</text>

  <text class="fadeUp title" x="70" y="168" font-size="56" font-weight="700" letter-spacing="1">
    <tspan fill="#f3f8ff">project-</tspan><tspan fill="#7fb0ff">blueprint</tspan>
  </text>

  <text class="fadeUp tagline" x="70" y="203" font-size="19" fill="#c3d8ff">
    <tspan x="70" dy="0">Build interview-ready projects &#8212; phase by phase, risk</tspan>
    <tspan x="70" dy="26">first, nothing claimed that wasn't proven.</tspan>
  </text>

  <g transform="translate(900,118)">
    <line class="flowline" x1="0" y1="0" x2="34" y2="0"/>
    <line class="flowline" x1="48" y1="0" x2="82" y2="0"/>
    <line class="flowline" x1="96" y1="0" x2="130" y2="0"/>
    <line class="flowline" x1="144" y1="0" x2="178" y2="0"/>

    <circle class="node pulse n1" cx="0" cy="0" r="7"/>
    <circle class="node pulse n2" cx="48" cy="0" r="7"/>
    <circle class="node pulse n3" cx="96" cy="0" r="7"/>
    <circle class="node pulse n4" cx="144" cy="0" r="7"/>
    <circle class="node pulse n5" cx="192" cy="0" r="7"/>

    <text class="nodelabel" x="0" y="22" text-anchor="middle">IDEA</text>
    <text class="nodelabel" x="48" y="22" text-anchor="middle">RISK</text>
    <text class="nodelabel" x="96" y="22" text-anchor="middle">BUILD</text>
    <text class="nodelabel" x="144" y="22" text-anchor="middle">BREAK</text>
    <text class="nodelabel" x="192" y="22" text-anchor="middle">PROVE</text>
  </g>
</svg>
