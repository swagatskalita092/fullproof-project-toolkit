<svg width="1100" height="210" viewBox="0 0 1100 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The six-step pipeline: pick your idea, name your risks, build in phases, adversarial testing, verification checklist, case study and resume">
  <defs>
    <pattern id="pgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(120,170,255,0.08)" stroke-width="1"/>
    </pattern>
    <marker id="parrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgba(160,200,255,0.45)"/>
    </marker>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace; }
    .bg { fill: #0a1e42; }
    .grid { fill: url(#pgrid); }
    .frame { fill: none; stroke: rgba(160,200,255,0.3); stroke-width: 1.5; rx: 10; }

    .pline { stroke: rgba(160,200,255,0.35); stroke-width: 2; }
    .node { fill: #0a1e42; stroke: #7fb0ff; stroke-width: 2; }
    .nlabel { fill: #e8f1ff; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
    .nnum { fill: rgba(195,216,255,0.55); font-size: 9.5px; }

    .lit { animation: lit 12s linear infinite; }
    @keyframes lit {
      0%   { fill: #7fb0ff; }
      6%   { fill: #7fb0ff; }
      16%  { fill: #0a1e42; }
      100% { fill: #0a1e42; }
    }
    .s0 { animation-delay: 0s; }
    .s1 { animation-delay: 2s; }
    .s2 { animation-delay: 4s; }
    .s3 { animation-delay: 6s; }
    .s4 { animation-delay: 8s; }
    .s5 { animation-delay: 10s; }

    .cap {
      font-size: 13.5px; fill: #c3d8ff; opacity: 0;
      animation-name: cap; animation-duration: 12s;
      animation-timing-function: linear; animation-iteration-count: infinite;
    }
    @keyframes cap {
      0%   { opacity: 0; }
      2%   { opacity: 1; }
      15%  { opacity: 1; }
      19%  { opacity: 0; }
      100% { opacity: 0; }
    }

    .dot {
      offset-path: path("M70,55 L254,55 L438,55 L622,55 L806,55 L990,55");
      offset-distance: 0%;
      animation: travel 12s linear infinite;
    }
    @keyframes travel {
      0%   { offset-distance: 0%; }
      83%  { offset-distance: 100%; }
      100% { offset-distance: 100%; }
    }
  </style>

  <rect class="bg" width="1100" height="210" rx="10"/>
  <rect class="grid" width="1100" height="210" rx="10"/>
  <rect class="frame" x="1" y="1" width="1098" height="208"/>

  <line class="pline" x1="70" y1="55" x2="990" y2="55"/>

  <g>
    <circle class="node lit s0" cx="70" cy="55" r="8"/>
    <circle class="node lit s1" cx="254" cy="55" r="8"/>
    <circle class="node lit s2" cx="438" cy="55" r="8"/>
    <circle class="node lit s3" cx="622" cy="55" r="8"/>
    <circle class="node lit s4" cx="806" cy="55" r="8"/>
    <circle class="node lit s5" cx="990" cy="55" r="8"/>
  </g>

  <circle class="dot" r="4" fill="#ffffff"/>

  <text class="nnum" x="70" y="34" text-anchor="middle">01</text>
  <text class="nlabel" x="70" y="80" text-anchor="middle">IDEA</text>

  <text class="nnum" x="254" y="34" text-anchor="middle">02</text>
  <text class="nlabel" x="254" y="80" text-anchor="middle">RISKS</text>

  <text class="nnum" x="438" y="34" text-anchor="middle">04</text>
  <text class="nlabel" x="438" y="80" text-anchor="middle">BUILD</text>

  <text class="nnum" x="622" y="34" text-anchor="middle">05</text>
  <text class="nlabel" x="622" y="80" text-anchor="middle">BREAK</text>

  <text class="nnum" x="806" y="34" text-anchor="middle">06</text>
  <text class="nlabel" x="806" y="80" text-anchor="middle">VERIFY</text>

  <text class="nnum" x="990" y="34" text-anchor="middle">07</text>
  <text class="nlabel" x="990" y="80" text-anchor="middle">PROVE</text>

  <rect x="24" y="110" width="1052" height="78" rx="8" fill="rgba(127,176,255,0.05)" stroke="rgba(160,200,255,0.25)"/>

  <text class="cap s0" x="46" y="140">01 &#183; Pick your idea. Name what a shallow version wouldn't prove, before writing any code.</text>
  <text class="cap s1" x="46" y="140">02 &#183; Name your risks. Write the invariant as a falsifiable sentence: what must always stay true.</text>
  <text class="cap s2" x="46" y="140">04 &#183; Build in phases. Each phase verified before the next one starts, not after the whole thing is done.</text>
  <text class="cap s3" x="46" y="140">05 &#183; Adversarial testing. Deliberately break it and capture real output; a claim with no scenario doesn't count.</text>
  <text class="cap s4" x="46" y="140">06 &#183; Verification checklist. Fresh clone, real infrastructure, a push confirmed against the remote, never a self-report.</text>
  <text class="cap s5" x="46" y="140">07 &#183; Case study and resume. Every real bug found gets written up: root cause, the fix, never softened.</text>

  <text x="46" y="168" font-size="11px" fill="rgba(195,216,255,0.5)">Each step has a matching importable Claude skill &#183; skill/portfolio-project-rigor runs all of them at once.</text>
</svg>
